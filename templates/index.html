<!DOCTYPE html>
<html>
<head>
    <title>Medicare Wish</title>
</head>
<body>
    <h2>Medicare Wish</h2>
    <p>AI-Based Medical Report Analyzer</p>

    <form method="post">
        Hemoglobin: <input type="number" step="0.1" name="hb" required><br><br>
        Glucose: <input type="number" step="0.1" name="glucose" required><br><br>
        <button type="submit">Analyze Report</button>
    </form>

    {% if results %}
        <h3>Analysis Results</h3>
        <ul>
        {% for r in results %}
            <li>{{ r.test }} ({{ r.value }}): {{ r.status }}</li>
        {% endfor %}
        </ul>
    {% endif %}
</body>
</html>
